<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagar con Webpay — attempo</title>
  <link rel="icon" href="/logo_attempo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, sans-serif;
      background: #f5f3ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(108,92,228,0.12);
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .logo { margin-bottom: 28px; }
    .logo img { height: 40px; }
    .spinner-wrap {
      margin: 0 auto 24px;
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #ede9fe;
      border-top-color: #6C5CE4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .webpay-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f0f4ff;
      border: 1px solid #c7d2fe;
      border-radius: 10px;
      padding: 10px 18px;
      margin-bottom: 28px;
      font-size: 13px;
      font-weight: 600;
      color: #1e3a8a;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #005BBB;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background .15s;
    }
    .btn:hover { background: #004a99; }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #9ca3af;
    }
    .footer a { color: #6C5CE4; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo_attempo.png" alt="attempo">
    </div>

    <div class="spinner-wrap">
      <div class="spinner"></div>
    </div>

    <h1>Redirigiendo a Transbank Webpay...</h1>
    <p>Serás redirigido al sitio seguro de Transbank para completar tu pago con tarjeta de crédito o débito.</p>

    <div class="webpay-badge">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#005BBB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Pago seguro con Webpay Plus
    </div>

    <form id="webpay-form" method="POST" action="/api/flow?tipo=webpay_create">
      <input type="hidden" id="input-cita" name="cita_id" value="">
      <input type="hidden" id="input-t" name="t" value="">
      <button type="submit" class="btn">Pagar con Webpay</button>
    </form>

    <div class="footer">
      <p>Pago procesado por <strong>Transbank</strong> — seguro y encriptado</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const cita   = params.get('cita');
    const t      = params.get('t');

    if (!cita || !t) {
      document.querySelector('h1').textContent = 'Enlace inválido';
      document.querySelector('p').textContent = 'Este enlace de pago no es válido o ha expirado.';
      document.querySelector('.spinner-wrap').style.display = 'none';
      document.querySelector('.btn').style.display = 'none';
    } else {
      document.getElementById('input-cita').value = cita;
      document.getElementById('input-t').value    = t;
      // Auto-submit after 800ms to allow the page to render
      setTimeout(() => {
        document.getElementById('webpay-form').submit();
      }, 800);
    }
  </script>
</body>
</html>
