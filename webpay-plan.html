<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagar plan attempo — Webpay</title>
  <link rel="icon" href="/logo_attempo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, sans-serif;
      background: #f5f3ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(108,92,228,0.12);
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .logo { margin-bottom: 28px; }
    .logo img { height: 40px; }
    .spinner-wrap {
      margin: 0 auto 24px;
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #ede9fe;
      border-top-color: #6C5CE4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
    .plan-badge {
      display: inline-block;
      background: #f5f3ff;
      border: 1.5px solid #c4b5fd;
      border-radius: 10px;
      padding: 10px 20px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #6C5CE4;
    }
    p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 24px; }
    .webpay-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f0f4ff;
      border: 1px solid #c7d2fe;
      border-radius: 10px;
      padding: 10px 18px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #1e3a8a;
    }
    .footer { margin-top: 20px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/logo_attempo.png" alt="attempo"></div>
    <div class="spinner-wrap"><div class="spinner"></div></div>
    <h1>Redirigiendo a Transbank Webpay...</h1>
    <div class="plan-badge" id="plan-badge">Plan attempo</div>
    <p>Serás redirigido al sitio seguro de Transbank para completar tu pago con tarjeta de crédito o débito.</p>
    <div class="webpay-badge">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#005BBB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Pago seguro con Webpay Plus
    </div>
    <div class="footer">Pago procesado por <strong>Transbank</strong> — seguro y encriptado</div>
  </div>

  <script>
    const params   = new URLSearchParams(location.search);
    const cid      = params.get('cid');
    const plan     = params.get('plan');
    const monto    = params.get('monto');
    const tipo_plan = params.get('tipo_plan') || '';
    const t        = params.get('t');

    const PLAN_LABELS = { inicio:'Agenda Esencial', pro:'Pro', clinica_ia:'Clínica IA' };
    const PLAN_PERIOD = { mensual:'Mensual', anual:'Anual' };
    if (tipo_plan || plan) {
      const label = (PLAN_LABELS[tipo_plan] ? PLAN_LABELS[tipo_plan] + ' ' : '') + (PLAN_PERIOD[plan] || '');
      document.getElementById('plan-badge').textContent = 'Plan ' + label;
    }

    if (!cid || !plan || !monto || !t) {
      document.querySelector('h1').textContent = 'Enlace inválido';
      document.querySelector('p').textContent  = 'Este enlace de pago no es válido o ha expirado.';
      document.querySelector('.spinner-wrap').style.display = 'none';
    } else {
      setTimeout(async () => {
        try {
          const body = new URLSearchParams({ cid, plan, monto, tipo_plan, t });
          const resp = await fetch('/api/flow?tipo=webpay_sub_create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body
          });
          const html = await resp.text();
          document.open(); document.write(html); document.close();
        } catch(e) {
          document.querySelector('h1').textContent = 'Error al conectar con Webpay';
          document.querySelector('p').textContent  = e.message;
          document.querySelector('.spinner-wrap').style.display = 'none';
        }
      }, 600);
    }
  </script>
</body>
</html>
