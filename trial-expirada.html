<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba finalizada — attempo</title>
  <link rel="icon" type="image/png" href="/logo_attempo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:       #6C5CE4;
      --purple-dark:  #4F3EE0;
      --purple-light: #E5E0FF;
      --bg:           #F8F7FF;
      --ink:          #16143A;
      --muted:        #9C96B4;
    }

    body {
      font-family: 'Geist', Inter, Arial, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(108, 92, 228, 0.14), 0 1px 4px rgba(108, 92, 228, 0.06);
    }

    .logo img {
      height: 44px;
      display: block;
      margin: 0 auto 10px;
    }
    .logo-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 32px;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      background: #FEF2F2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      transition: opacity 0.18s, transform 0.12s;
      margin-bottom: 12px;
      width: 100%;
      justify-content: center;
    }
    .btn-wa:hover { opacity: 0.92; transform: translateY(-1px); }

    .btn-email {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      transition: opacity 0.18s, transform 0.12s;
      width: 100%;
      justify-content: center;
    }
    .btn-email:hover { opacity: 0.92; transform: translateY(-1px); }

    .divider {
      font-size: 12px;
      color: var(--muted);
      margin: 6px 0;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }
    .footer a { color: var(--purple); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo">
      <img src="/logo_attempo.png" alt="attempo logo" />
      <div class="logo-name">attempo</div>
    </div>

    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>

    <h1>Tu prueba gratuita<br>ha terminado</h1>
    <p class="desc">
      Los 12 días de prueba de tu cuenta attempo han finalizado.<br>
      Contáctanos para activar tu plan y seguir gestionando tus citas sin interrupciones.
    </p>

    <a class="btn-wa" href="https://wa.me/56957285407?text=Hola%2C%20quiero%20contratar%20un%20plan%20de%20attempo" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#fff">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.107.547 4.084 1.504 5.798L0 24l6.333-1.482A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.886 0-3.65-.51-5.166-1.395l-.371-.22-3.753.878.894-3.656-.242-.382A9.936 9.936 0 012 12C2 6.486 6.486 2 12 2s10 4.486 10 10-4.486 10-10 10z"/>
      </svg>
      Escribir por WhatsApp
    </a>

    <div class="divider">o</div>

    <a class="btn-email" href="mailto:hola@attempo.cl?subject=Quiero%20contratar%20un%20plan&body=Hola%2C%20mi%20prueba%20gratuita%20de%20attempo%20termin%C3%B3%20y%20quisiera%20contratar%20un%20plan.">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      Enviar email a hola@attempo.cl
    </a>

    <div class="footer">
      <p>¿Ya tienes un plan activo? <a href="/login">Inicia sesión →</a></p>
    </div>

  </div>
</body>
</html>
