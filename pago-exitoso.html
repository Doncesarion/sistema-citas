<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago confirmado — attempo</title>
  <link rel="icon" href="/logo_attempo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --a:#6C5CE4;--a3:#4F3EE0;--adim:rgba(108,92,228,0.08);
      --bg:#F8F7FF;
      --t1:#16143A;--t2:#5E5880;--t3:#9C96B4;--t4:#C4C0D8;
      --green:#16A34A;--red:#DC2626;--amber:#D97706;
      --b1:rgba(108,92,228,0.08);--b2:rgba(108,92,228,0.18);
      --sh1:0 4px 24px rgba(108,92,228,0.12),0 1px 4px rgba(108,92,228,0.06);
      --r:8px;--rl:12px;--rx:16px;
    }
    html,body{min-height:100%;font-family:'Geist',sans-serif;background:var(--bg);color:var(--t1)}
    body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(108,92,228,0.07),transparent 70%),radial-gradient(ellipse 40% 50% at 80% 90%,rgba(139,124,248,0.06),transparent 70%)}
    .card{position:relative;z-index:1;background:#fff;border:1px solid var(--b1);border-radius:var(--rx);box-shadow:var(--sh1);padding:44px 40px 40px;max-width:460px;width:100%;text-align:center}
    .logo{margin-bottom:28px}
    .logo img{height:36px;border-radius:8px}
    .icon-circle{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
    @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
    .icon-circle.ok{background:rgba(22,163,74,0.1);border:2px solid rgba(22,163,74,0.22)}
    .icon-circle.err{background:rgba(220,38,38,0.08);border:2px solid rgba(220,38,38,0.18)}
    .icon-circle.warn{background:rgba(217,119,6,0.08);border:2px solid rgba(217,119,6,0.2)}
    h1{font-size:21px;font-weight:700;color:var(--t1);letter-spacing:-.03em;margin-bottom:8px}
    p{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:24px}
    .pill{display:inline-flex;align-items:center;gap:6px;background:var(--adim);color:var(--a);font-size:12px;font-weight:600;padding:6px 14px;border-radius:100px;border:1px solid var(--b2);margin-bottom:28px}
    .pill.ok{background:rgba(22,163,74,0.08);color:var(--green);border-color:rgba(22,163,74,0.2)}
    .pill.err{background:rgba(220,38,38,0.07);color:var(--red);border-color:rgba(220,38,38,0.15)}
    .pill.warn{background:rgba(217,119,6,0.07);color:var(--amber);border-color:rgba(217,119,6,0.18)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 28px;background:linear-gradient(135deg,var(--a),var(--a3));color:#fff;text-decoration:none;border-radius:var(--r);font-size:14px;font-weight:600;transition:all .15s;box-shadow:0 2px 10px rgba(108,92,228,.28);border:none;cursor:pointer;font-family:'Geist',sans-serif}
    .btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(108,92,228,.4)}
    .btn.secondary{background:#fff;color:var(--t2);border:1.5px solid var(--b1);box-shadow:none}
    .btn.secondary:hover{border-color:var(--b2);color:var(--t1)}
    .btn-row{display:flex;flex-direction:column;gap:8px;align-items:center}
    .footer{margin-top:24px;font-size:12px;color:var(--t4)}
    .footer a{color:var(--a);text-decoration:none}
    @media(max-width:480px){.card{padding:32px 24px 28px}}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo_attempo.png" alt="attempo">
    </div>

    <div class="icon-circle ok" id="icon-wrap">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1 id="main-title">¡Pago confirmado!</h1>
    <p id="main-desc">Tu suscripción a attempo fue activada exitosamente. Ya puedes acceder a todas las funciones de tu plan.</p>

    <div class="pill ok" id="plan-pill">Plan mensual activo ✓</div>

    <div class="btn-row">
      <a href="/admin" class="btn" id="main-btn">Ir al panel de administración</a>
    </div>

    <div class="footer">
      <p>¿Tienes dudas? Escríbenos a <a href="mailto:contacto@attempo.cl">contacto@attempo.cl</a></p>
    </div>
  </div>

  <script>
    const params  = new URLSearchParams(location.search);
    const tipo    = params.get('tipo');
    const plan    = params.get('plan');
    history.replaceState(null, '', '/pago-exitoso');

    const iconWrap = document.getElementById('icon-wrap');
    const title    = document.getElementById('main-title');
    const desc     = document.getElementById('main-desc');
    const pill     = document.getElementById('plan-pill');
    const btn      = document.getElementById('main-btn');

    function setOk(titleTxt, descTxt, pillTxt) {
      title.textContent = titleTxt;
      desc.textContent  = descTxt;
      pill.textContent  = pillTxt;
      pill.className    = 'pill ok';
    }

    function setError(titleTxt, descTxt, pillTxt, isWarn) {
      iconWrap.className = isWarn ? 'icon-circle warn' : 'icon-circle err';
      const strokeColor  = isWarn ? '#D97706' : '#DC2626';
      iconWrap.innerHTML = `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
      title.textContent = titleTxt;
      desc.textContent  = descTxt;
      pill.textContent  = pillTxt;
      pill.className    = isWarn ? 'pill warn' : 'pill err';
      btn.href          = document.referrer || 'https://app.attempo.cl';
      btn.textContent   = 'Volver';
      btn.className     = 'btn secondary';
      const retryBtn = document.createElement('a');
      retryBtn.href = 'javascript:history.back()';
      retryBtn.className = 'btn';
      retryBtn.textContent = 'Volver a intentar';
      btn.parentNode.insertBefore(retryBtn, btn.nextSibling);
    }

    if (tipo === 'plan') {
      const resultado = params.get('resultado') || 'error';
      const planLabel = plan === 'anual' ? 'Plan anual activo ✓' : 'Plan mensual activo ✓';
      if (resultado === 'ok') {
        setOk('¡Suscripción activada!', 'Tu plan de attempo está activo. Ya puedes acceder a todas las funciones.', planLabel);
        btn.href = '/admin';
        btn.textContent = 'Ir al panel de administración';
      } else if (resultado === 'cancelado') {
        setError('Pago cancelado', 'Cancelaste el pago en Webpay. Tu suscripción no fue renovada. Escríbenos a contacto@attempo.cl si necesitas ayuda.', 'Pago cancelado', false);
      } else if (resultado === 'rechazado') {
        setError('Pago rechazado', 'Tu tarjeta fue rechazada. Intenta con otra tarjeta o contacta a contacto@attempo.cl.', 'Tarjeta rechazada', false);
      } else if (resultado === 'timeout') {
        setError('Tiempo agotado', 'La sesión de pago expiró. Por favor solicita un nuevo enlace de pago.', 'Tiempo agotado', true);
      } else {
        setError('Error en el pago', 'Ocurrió un error al procesar el pago. Contacta a contacto@attempo.cl.', 'Error de pago', false);
      }

    } else if (tipo === 'webpay') {
      const resultado = params.get('resultado') || 'error';
      if (resultado === 'ok') {
        const slug = params.get('slug');
        setOk('¡Pago confirmado!', 'Tu cita está reservada. Recibirás un correo con los detalles.', 'Cita confirmada con Webpay ✓');
        btn.href = slug ? `https://app.attempo.cl/${slug}` : 'https://attempo.cl';
        btn.textContent = slug ? 'Volver al negocio' : 'Volver al inicio';
      } else if (resultado === 'cancelado') {
        setError('Pago cancelado', 'Cancelaste el pago en Webpay. Tu cita NO fue reservada.', 'Pago cancelado', false);
      } else if (resultado === 'rechazado') {
        setError('Pago rechazado', 'Tu tarjeta fue rechazada. Intenta con otra tarjeta o método de pago.', 'Tarjeta rechazada', false);
      } else if (resultado === 'timeout') {
        setError('Tiempo agotado', 'La sesión de pago expiró. Por favor genera un nuevo enlace de pago.', 'Tiempo agotado', true);
      } else {
        setError('Error en el pago', 'Ocurrió un error al procesar el pago. Por favor intenta nuevamente.', 'Error de pago', false);
      }

    } else if (tipo === 'cita') {
      const slug = params.get('slug');
      setOk('¡Pago recibido!', 'Tu cita está confirmada. Recibirás un correo con los detalles de tu reserva.', 'Cita confirmada ✓');
      let vueltaHref = 'https://app.attempo.cl';
      if (slug) {
        vueltaHref = `https://app.attempo.cl/${slug}`;
      } else if (document.referrer) {
        try {
          const ref = new URL(document.referrer);
          if (ref.hostname === 'app.attempo.cl' && ref.pathname.length > 1) vueltaHref = document.referrer;
        } catch {}
      }
      btn.href = vueltaHref;
      btn.textContent = 'Volver al negocio';

    } else if (plan === 'anual') {
      pill.textContent = 'Plan anual activo ✓';
    }
  </script>
</body>
</html>
